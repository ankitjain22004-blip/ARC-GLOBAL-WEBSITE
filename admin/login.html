<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>ARC Admin · Sign in</title><link rel="stylesheet" href="assets/admin.css"></head>
<body class="login"><form id="f" class="box"><h1>ARC Global <span>Admin</span></h1><label>Email<input name="e" type="email" required autocomplete="username"></label><label>Password<input name="p" type="password" required autocomplete="current-password"></label><button class="btn">Sign in</button><p id="m" role="alert"></p><small style="color:#8b92a3">Forgot your password? Reset it with the create-admin command (see docs/SETUP.md).</small></form>
<script src="../config/config.js"></script><script src="assets/auth.js"></script>
<script>const m=document.getElementById('m'),f=document.getElementById('f');if(!API)m.textContent='API not configured. Edit config/config.js (see docs/SETUP.md).';else Auth.me().then(u=>{if(u)location.replace('dashboard.html')});
f.onsubmit=async e=>{e.preventDefault();m.textContent='Signing in…';try{await Auth.login(f.e.value,f.p.value);location.replace('dashboard.html')}catch(x){m.textContent=x.message}};</script></body></html>
